// ===== Canvas scaling =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() {
  const dpr = window.devicePixelRatio || 1;
  // Fit the height, then widen the view to fill the window instead of letterboxing.
  let scale = window.innerHeight / H;
  let w = window.innerWidth / scale;
  if (w < BASE_W) { scale = window.innerWidth / BASE_W; w = BASE_W; }
  const oldX = CHAR_X;
  W = Math.round(Math.min(w, MAX_W));
  CHAR_X = (W - BASE_W) / 2 + BASE_W * 0.28;       // the original 400px view sits in the middle
  try { for (const p of pipes) p.x += CHAR_X - oldX; } catch (e) {}  // keep columns in place relative to the bird
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.width = Math.round(W * dpr * scale);
  canvas.height = Math.round(H * dpr * scale);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

// ===== Load + pre-render art =====
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

let skyCanvas, groundCanvas, pipeCanvas, charImg, ready = false;
const ART_SCALE = 2; // pre-render at 2x for crispness on hi-dpi screens
Promise.all([load(SRC.background), load(SRC.character), load(SRC.obsicalls)]).then(([bg, ch, pipe]) => {
  charImg = ch;

  // Background: scale to game height, split into sky (parallax) and ground (scrolls with columns)
  const s = (H * ART_SCALE) / bg.height;
  const bw = Math.round(bg.width * s);
  const groundSrcY = Math.round(bg.height * (1 - GROUND_FRAC));
  let g;
  [skyCanvas, g] = mk(bw, (H - GROUND_H) * ART_SCALE);
  g.drawImage(bg, 0, 0, bg.width, groundSrcY, 0, 0, bw, skyCanvas.height);
  [groundCanvas, g] = mk(bw, GROUND_H * ART_SCALE);
  g.drawImage(bg, 0, groundSrcY, bg.width, bg.height - groundSrcY, 0, 0, bw, groundCanvas.height);

  // Column: first shrink the art so each texture pixel becomes chunkier
  const sw = Math.round(pipe.width / PIPE_PIXEL), sh = Math.round(pipe.height / PIPE_PIXEL);
  const [small, sg] = mk(sw, sh);
  sg.drawImage(pipe, 0, 0, sw, sh);
  const capRow = Math.round(sh * 0.927);                     // where the cap starts in your art
  const texel = (PIPE_W * ART_SCALE) / sw;                   // size of one texture pixel on screen

  // Then build a tall column with the cap at the bottom, tiling the body (no stretching)
  const pw = PIPE_W * ART_SCALE, ph = (H + 100) * ART_SCALE;
  const capH = Math.round((sh - capRow) * texel);
  const bodyRows = capRow - 1, tileH = bodyRows * texel;
  [pipeCanvas, g] = mk(pw, ph);
  for (let yy = ph - capH - tileH; yy > -tileH; yy -= tileH) {
    g.drawImage(small, 0, 1, sw, bodyRows, 0, Math.round(yy), pw, Math.round(tileH));
  }
  g.drawImage(small, 0, capRow, sw, sh - capRow, 0, ph - capH, pw, capH);

  ready = true;
});

// ===== State =====
let state = 'start'; // start | play | over
let y, vy, pipes, score, best, skyX = 0, groundX = 0, distSinceLast, flashT;
try { best = parseInt(localStorage.getItem('skyglide_best')) || 0; } catch (e) { best = 0; }

function reset() {
  y = H * 0.42; vy = 0; pipes = []; score = 0;
  distSinceLast = PIPE_SPACING; flashT = 0;
}
reset();

function spawnPipe(x = W + 10) {
  const margin = 60;
  const gapY = margin + Math.random() * (H - GROUND_H - GAP - margin * 2);
  pipes.push({ x, gapY, passed: false });
}

// On a wide view, fill the screen ahead with columns at the normal spacing, so the
// first column reaches the bird at the same moment as in the original 400px game.
function seedPipes() {
  let x = CHAR_X + (BASE_W + 10 - BASE_W * 0.28);
  let lastX = x;
  while (x <= W + 10) { spawnPipe(x); lastX = x; x += PIPE_SPACING; }
  distSinceLast = W + 10 - lastX;
}

// ===== Input =====
function press() {
  if (!ready) return;
  if (state === 'start') { state = 'play'; vy = BOOST; seedPipes(); }
  else if (state === 'play') { vy = BOOST; }
  else if (state === 'over' && flashT <= 0) { reset(); state = 'start'; }
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) press(); }
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });

// ===== Update =====
function update(dt) {
  if (state !== 'over') {
    skyX += BG_SPEED * dt;
    groundX += PIPE_SPEED * dt;
  }

  if (state === 'start') {
    y = H * 0.42 + Math.sin(performance.now() / 300) * 8;
    return;
  }
  if (state === 'over') {
    flashT -= dt;
    if (y < H - GROUND_H - CHAR_H / 2) {
      vy = Math.min(vy + GRAVITY * dt, MAX_FALL);
      y = Math.min(y + vy * dt, H - GROUND_H - CHAR_H / 2);
    }
    return;
  }

  vy = Math.min(vy + GRAVITY * dt, MAX_FALL);
  y += vy * dt;

  distSinceLast += PIPE_SPEED * dt;
  if (distSinceLast >= PIPE_SPACING) { distSinceLast = 0; spawnPipe(); }

  for (const p of pipes) {
    p.x -= PIPE_SPEED * dt;
    if (!p.passed && p.x + PIPE_W < CHAR_X) { p.passed = true; score++; }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -10);

  // Collisions
  const hw = CHAR_W * HITBOX_SHRINK / 2, hh = CHAR_H * HITBOX_SHRINK / 2;
  if (y - hh <= 0 || y + hh >= H - GROUND_H) return die();
  for (const p of pipes) {
    if (CHAR_X + hw > p.x + 3 && CHAR_X - hw < p.x + PIPE_W - 3) {
      if (y - hh < p.gapY || y + hh > p.gapY + GAP) return die();
    }
  }
}

function die() {
  state = 'over';
  flashT = 0.6;
  if (score > best) {
    best = score;
    try { localStorage.setItem('skyglide_best', best); } catch (e) {}
  }
}

// ===== Draw =====
function tile(img, offset, yPos, h) {
  const w = img.width / ART_SCALE;
  let x = -(offset % w);
  while (x < W) { ctx.drawImage(img, Math.floor(x), yPos, Math.ceil(w) + 1, h); x += w; }
}

function drawColumns() {
  const ph = pipeCanvas.height / ART_SCALE;
  for (const p of pipes) {
    const x = Math.round(p.x);
    // top column: cap at the bottom, hanging down to the gap
    ctx.drawImage(pipeCanvas, x, p.gapY - ph, PIPE_W, ph);
    // bottom column: flipped so the cap faces up at the gap
    ctx.save();
    ctx.translate(x, p.gapY + GAP);
    ctx.scale(1, -1);
    ctx.drawImage(pipeCanvas, 0, -ph, PIPE_W, ph);
    ctx.restore();
  }
}

function drawCharacter() {
  const angle = state === 'start' ? 0 : Math.max(-0.45, Math.min(1.3, vy / 600));
  ctx.save();
  ctx.translate(CHAR_X, y);
  ctx.rotate(angle);
  ctx.drawImage(charImg, -CHAR_W / 2, -CHAR_H / 2, CHAR_W, CHAR_H);
  ctx.restore();
}

function text(str, x, yy, size) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(4, size / 6); ctx.strokeStyle = '#123';
  ctx.strokeText(str, x, yy);
  ctx.fillStyle = '#fff'; ctx.fillText(str, x, yy);
}

function draw() {
  if (!ready) {
    ctx.fillStyle = '#4fb3d6'; ctx.fillRect(0, 0, W, H);
    text('Loading…', W / 2, H / 2, 28);
    return;
  }
  tile(skyCanvas, skyX, 0, H - GROUND_H);
  drawColumns();
  tile(groundCanvas, groundX, H - GROUND_H, GROUND_H);
  drawCharacter();

  if (state === 'play') text(score, W / 2, 70, 56);

  if (state === 'start') {
    text('SKY GLIDE', W / 2, H * 0.2, 50);
    text('Click, tap or press Space', W / 2, H * 0.6, 22);
    text('to start', W / 2, H * 0.6 + 30, 22);
    if (best) text('Best: ' + best, W / 2, H * 0.72, 22);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W / 2, H * 0.3, 46);
    text('Score: ' + score, W / 2, H * 0.42, 30);
    text('Best: ' + best, W / 2, H * 0.49, 30);
    if (flashT <= 0) text('Click or press Space to retry', W / 2, H * 0.62, 20);
  }
}

// ===== Loop =====
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
