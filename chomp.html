<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHOMP</title>
<meta name="description" content="A small maze game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--blue:#0404f0;--yellow:#fefd02;--red:#eb0005;--cyan:#0bace3;--orange:#f08300;--pink:#f49cb4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font-family:"Press Start 2P",ui-monospace,monospace;text-align:center;padding:16px}
#chomp{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.chomp-frame{display:flex;gap:16px;align-items:stretch;padding:12px;background:#000;border:9px double var(--blue);border-radius:4px}
#chomp-canvas{display:block;touch-action:none;image-rendering:pixelated}
.chomp-side{width:170px;display:flex;flex-direction:column;gap:18px;text-align:left;padding:6px 4px 6px 18px;border-left:6px double var(--blue)}
.chomp-title{font-size:1.15rem;letter-spacing:.06em;color:var(--yellow);text-shadow:3px 3px 0 var(--red);margin-bottom:6px}
.chomp-stat span{display:block;font-size:.6rem;letter-spacing:.1em;color:#fff;margin-bottom:8px}
.chomp-stat b{display:block;font-size:1rem;font-weight:400;line-height:1.2}
#chomp-score{color:var(--yellow)}
#chomp-best{color:var(--pink)}
#chomp-level{color:var(--cyan)}
#chomp-lives{color:var(--orange)}
.chomp-lifeicons{display:flex;gap:6px;margin-top:8px;min-height:16px}
.chomp-lifeicons i{width:26px;height:26px;background-size:100% 100%;image-rendering:pixelated;transform:scaleX(-1)}
.chomp-help{font-size:.5rem;color:#8a8aff;margin:auto 0 0;line-height:2}
.chomp-pad{display:none;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,42px);gap:6px;margin-top:auto}
.chomp-pad button{background:#000;border:3px double var(--blue);color:var(--yellow);border-radius:6px;font-size:.9rem;cursor:pointer;font-family:inherit}
.chomp-pad button:active{background:var(--blue)}
.chomp-pad [data-dir=up]{grid-column:2}.chomp-pad [data-dir=left]{grid-column:1;grid-row:2}
.chomp-pad [data-dir=down]{grid-column:2;grid-row:2}.chomp-pad [data-dir=right]{grid-column:3;grid-row:2}
@media (pointer:coarse){.chomp-pad{display:grid}.chomp-help{display:none}}
/* Narrow screens: panel drops below the maze */
.chomp-frame.stacked{flex-direction:column;align-items:center}
.stacked .chomp-side{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px 18px;border-left:0;border-top:6px double var(--blue);padding:14px 0 2px}
.stacked .chomp-title{width:100%;text-align:center;margin:0}
.stacked .chomp-stat{text-align:center}
.stacked .chomp-stat b{font-size:.8rem}
.stacked .chomp-lifeicons{display:none}
.stacked .chomp-pad,.stacked .chomp-help{margin:0}
</style></head>
<body><div id="chomp" role="application" aria-label="CHOMP mini-game">
<div class="chomp-frame" id="chomp-frame">
<canvas id="chomp-canvas"></canvas>
<aside class="chomp-side">
<div class="chomp-title">CHOMP</div>
<div class="chomp-stat"><span>1UP</span><b id="chomp-score">0</b></div>
<div class="chomp-stat"><span>HIGH SCORE</span><b id="chomp-best">0</b></div>
<div class="chomp-stat"><span>LIVES</span><b id="chomp-lives">3</b><div class="chomp-lifeicons" id="chomp-lifeicons"></div></div>
<div class="chomp-stat"><span>LEVEL</span><b id="chomp-level">1</b></div>
<p class="chomp-help">ARROWS/WASD<br>TO MOVE<br><br>SPACE TO<br>PLAY AGAIN</p>
<div class="chomp-pad" aria-label="Controls">
<button type="button" data-dir="up" aria-label="Up">&#9650;</button>
<button type="button" data-dir="left" aria-label="Left">&#9664;</button>
<button type="button" data-dir="down" aria-label="Down">&#9660;</button>
<button type="button" data-dir="right" aria-label="Right">&#9654;</button>
</div>
</aside>
</div>
</div>
<script>
(function () {
  var MAZE = [
    "###################",
    "#........#........#",
    "#o##.###.#.###.##o#",
    "#.................#",
    "#.##.#.#####.#.##.#",
    "#....#...#...#....#",
    "####.###.#.###.####",
    "   #.#.......#.#   ",
    "####.#.##-##.#.####",
    "    ...#GGG#...    ",
    "####.#.#####.#.####",
    "   #.#.......#.#   ",
    "####.#.#####.#.####",
    "#........#........#",
    "#.##.###.#.###.##.#",
    "#o.#.....P.....#.o#",
    "##.#.#.#####.#.#.##",
    "#....#...#...#....#",
    "#.######.#.######.#",
    "#.................#",
    "###################"
  ];
  var COLS = 19, ROWS = 21;
  var BLUE = "#0404f0", YELLOW = "#fefd02", PELLET = "#ffb8ae", FONT = '"Press Start 2P", ui-monospace, monospace';
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var GHOSTS = [
    { color: "#eb0005", delay: 0, home: [9, 9] },
    { color: "#f49cb4", delay: 2, home: [8, 9] },
    { color: "#0bace3", delay: 5, home: [10, 9] },
    { color: "#f08300", delay: 8, home: [9, 9] }
  ];

  var overlay = document.getElementById("chomp");
  var frameEl = document.getElementById("chomp-frame");
  var canvas = document.getElementById("chomp-canvas");
  var ctx = canvas.getContext("2d");
  var elScore = document.getElementById("chomp-score");
  var elBest = document.getElementById("chomp-best");
  var elLives = document.getElementById("chomp-lives");
  var elLifeIcons = document.getElementById("chomp-lifeicons");
  var elLevel = document.getElementById("chomp-level");

  var grid, pellets, score, lives, level, state, stateT, clock, frightT, chain;
  var pac, ghosts, want = null, raf = 0, last = 0;
  var best = 0, PAC_ICON = "";
  try { best = Number(localStorage.getItem("chomp-best")) || 0; } catch (e) {}

  function cell(x, y) {
    if (y < 0 || y >= ROWS) return "#";
    x = ((x % COLS) + COLS) % COLS;
    return grid[y][x];
  }
  function open(x, y) {
    var c = cell(x, y);
    return c !== "#" && c !== "-" && c !== "G";
  }
  function isWall(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
    return MAZE[y][x] === "#";
  }

  function mover(x, y, speed) {
    return { x: x, y: y, tx: x, ty: y, dx: 0, dy: 0, speed: speed };
  }

  function loadMaze() {
    grid = MAZE.map(function (r) { return r.split(""); });
    pellets = 0;
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (grid[y][x] === "." || grid[y][x] === "o") pellets++;
        if (grid[y][x] === "P") grid[y][x] = " ";
      }
    }
  }

  function placeActors() {
    pac = mover(9, 15, 4.6 + level * 0.25);
    pac.dx = -1;
    want = null;
    ghosts = GHOSTS.map(function (g) {
      var m = mover(g.home[0], g.home[1], 4.1 + level * 0.3);
      m.color = g.color;
      m.home = g.home;
      m.inHouse = true;
      m.releaseAt = clock + g.delay;
      m.scared = false;
      return m;
    });
    frightT = 0;
    chain = 0;
  }

  function newGame() {
    score = 0; lives = 3; level = 1; clock = 0;
    loadMaze();
    placeActors();
    setState("ready", 1.6);
    hud();
  }

  function setState(s, t) { state = s; stateT = t || 0; }

  function hud() {
    elScore.textContent = score;
    elBest.textContent = best;
    elLives.textContent = lives;
    elLevel.textContent = level;
    elLifeIcons.innerHTML = new Array(Math.max(0, lives) + 1).join('<i style="background-image:url(' + PAC_ICON + ')"></i>');
  }

  function addScore(n) {
    score += n;
    if (score > best) {
      best = score;
      try { localStorage.setItem("chomp-best", String(best)); } catch (e) {}
    }
    hud();
  }

  // Move along the grid; choose() is called at every tile centre.
  function step(e, dt, choose, arrive) {
    var dist = e.speed * dt * (e.scared ? 0.6 : 1) * (e.inTunnel ? 0.6 : 1);
    for (var i = 0; i < 6 && dist > 0; i++) {
      if (e.x === e.tx && e.y === e.ty) {
        choose(e);
        if (!e.dx && !e.dy) return;
        e.tx = e.x + e.dx;
        e.ty = e.y + e.dy;
      }
      var rem = Math.abs(e.tx - e.x) + Math.abs(e.ty - e.y);
      if (dist >= rem) {
        e.x = e.tx; e.y = e.ty; dist -= rem;
        if (e.x < 0) { e.x += COLS; e.tx = e.x; }
        if (e.x >= COLS) { e.x -= COLS; e.tx = e.x; }
        if (arrive) arrive(e);
      } else {
        e.x += Math.sign(e.tx - e.x) * dist;
        e.y += Math.sign(e.ty - e.y) * dist;
        dist = 0;
      }
    }
  }

  function choosePac(e) {
    if (want && open(e.x + want[0], e.y + want[1])) { e.dx = want[0]; e.dy = want[1]; }
    else if (!open(e.x + e.dx, e.y + e.dy)) { e.dx = 0; e.dy = 0; }
  }

  function arrivePac(e) {
    var c = grid[e.y][e.x];
    if (c === "." || c === "o") {
      grid[e.y][e.x] = " ";
      pellets--;
      if (c === ".") addScore(10);
      else {
        addScore(50);
        frightT = Math.max(2, 7 - level);
        chain = 0;
        ghosts.forEach(function (g) {
          if (g.inHouse) return;
          g.scared = true;
          // Turn round towards the tile it came from.
          g.tx -= g.dx; g.ty -= g.dy;
          g.dx = -g.dx; g.dy = -g.dy;
        });
      }
      if (pellets === 0) setState("won", 1.8);
    }
  }

  function ghostTarget(g, i) {
    // Each 27 s: scatter to corners for 7 s, then chase.
    if (clock % 27 < 7) return [[COLS, -2], [-1, -2], [COLS, ROWS + 1], [-1, ROWS + 1]][i];
    if (i === 1) return [pac.x + pac.dx * 4, pac.y + pac.dy * 4];
    if (i === 2) {
      var ax = pac.x + pac.dx * 2, ay = pac.y + pac.dy * 2;
      return [ax * 2 - ghosts[0].x, ay * 2 - ghosts[0].y];
    }
    if (i === 3 && Math.hypot(g.x - pac.x, g.y - pac.y) < 7) return [-1, ROWS + 1];
    return [pac.x, pac.y];
  }

  function chooseGhost(g) {
    var opts = [];
    Object.keys(DIRS).forEach(function (k) {
      var d = DIRS[k];
      if (d[0] === -g.dx && d[1] === -g.dy && (g.dx || g.dy)) return;
      if (open(g.x + d[0], g.y + d[1])) opts.push(d);
    });
    if (!opts.length) { g.dx = -g.dx; g.dy = -g.dy; return; }
    var pick = opts[0];
    if (g.scared) pick = opts[Math.floor(Math.random() * opts.length)];
    else {
      var t = ghostTarget(g, ghosts.indexOf(g)), bestD = Infinity;
      opts.forEach(function (d) {
        var dd = Math.pow(g.x + d[0] - t[0], 2) + Math.pow(g.y + d[1] - t[1], 2);
        if (dd < bestD) { bestD = dd; pick = d; }
      });
    }
    g.dx = pick[0]; g.dy = pick[1];
  }

  function sendHome(g, wait) {
    g.inHouse = true; g.scared = false;
    g.x = g.tx = g.home[0]; g.y = g.ty = g.home[1];
    g.dx = g.dy = 0;
    g.releaseAt = clock + wait;
  }

  function update(dt) {
    if (state !== "play") {
      stateT -= dt;
      if (stateT > 0) return;
      if (state === "ready") setState("play");
      else if (state === "dead") {
        if (lives <= 0) setState("over");
        else { placeActors(); setState("ready", 1.2); }
      } else if (state === "won") {
        level++; loadMaze(); placeActors(); hud(); setState("ready", 1.6);
      }
      return;
    }
    clock += dt;
    if (frightT > 0) {
      frightT -= dt;
      if (frightT <= 0) ghosts.forEach(function (g) { g.scared = false; });
    }
    step(pac, dt, choosePac, arrivePac);
    if (state !== "play") return;
    ghosts.forEach(function (g) {
      if (g.inHouse) {
        if (clock >= g.releaseAt) {
          g.inHouse = false;
          g.x = g.tx = 9; g.y = g.ty = 7;
          g.dx = Math.random() < 0.5 ? -1 : 1; g.dy = 0;
        }
        return;
      }
      g.inTunnel = g.y === 9 && (g.x < 4 || g.x > 14);
      step(g, dt, chooseGhost);
      if (Math.abs(g.x - pac.x) + Math.abs(g.y - pac.y) < 0.7) {
        if (g.scared) {
          chain++;
          addScore(100 * Math.pow(2, chain));
          sendHome(g, 3);
        } else {
          lives--; hud();
          setState("dead", 1.4);
        }
      }
    });
  }

  // Everything is drawn on a small canvas (P px per tile) and scaled up with hard edges.
  var P = 14;
  function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function bitmap(rows, x, y, c) {
    ctx.fillStyle = c;
    for (var j = 0; j < rows.length; j++)
      for (var i = 0; i < rows[j].length; i++)
        if (rows[j][i] !== ".") ctx.fillRect(x + i, y + j, 1, 1);
  }

  var GHOST_TOP = [
    ".....####.....",
    "...########...",
    "..##########..",
    ".############.",
    ".############.",
    ".############.",
    "##############",
    "##############",
    "##############",
    "##############",
    "##############",
    "##############",
    "##############"
  ];
  var GHOST_FEET = ["##.###..###.##", "#...##..##...#"];
  var EYE = [".##.", "####", "####", "####", ".##."];
  var SCARED = [
    "..............", "..............", "..............", "..............",
    "..............", "....##..##....", "....##..##....", "..............",
    "..............", ".##..##..##..#", "#..##..##..##.", "..............",
    "..............", ".............."
  ];

  // Pac-Man is rasterised from a circle with a wedge cut out, so the mouth animates smoothly in pixels.
  function pacPixels(mouth, ang) {
    var out = [];
    for (var j = 0; j < 13; j++) {
      var row = "";
      for (var i = 0; i < 13; i++) {
        var dx = i - 6, dy = j - 6;
        var inside = dx * dx + dy * dy <= 6.5 * 6.5 - 0.5;
        if (inside && (dx || dy)) {
          var a = Math.atan2(dy, dx) - ang;
          a = Math.atan2(Math.sin(a), Math.cos(a));
          if (Math.abs(a) < mouth * Math.PI) inside = false;
        }
        row += inside ? "#" : ".";
      }
      out.push(row);
    }
    return out;
  }

  function draw(now) {
    var W = COLS * P, H = ROWS * P;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    // Double-line walls, 1px thick, inset 2px and 5px inside each wall block.
    ctx.fillStyle = BLUE;
    wallLines(2);
    wallLines(5);

    // Ghost-house door (row 8, column 9).
    px(9 * P, 8 * P + 6, P, 2, "#f49cb4");

    // Pellets in the player's yellow.
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (grid[y][x] === ".") px(x * P + 6, y * P + 6, 2, 2, YELLOW);
      }
    }
    if (Math.floor(now / 220) % 2 === 0) {
      for (y = 0; y < ROWS; y++) {
        for (x = 0; x < COLS; x++) {
          if (grid[y][x] === "o") bitmap([".####.", "######", "######", "######", "######", ".####."], x * P + 4, y * P + 4, YELLOW);
        }
      }
    }

    ghosts.forEach(function (g, i) {
      var gx = (g.x + 0.5) * P, gy = (g.y + 0.5) * P;
      if (g.inHouse) gy += Math.round(Math.sin(now / 200 + i) * 2);
      drawGhost(Math.round(gx) - 7, Math.round(gy) - 7, g, now);
    });

    if (!(state === "dead" && Math.floor(now / 120) % 2)) drawPac(now);

    var msg = state === "ready" ? (level > 1 ? "LEVEL " + level : "READY!")
      : state === "over" ? "GAME OVER" : state === "won" ? "CLEARED!" : "";
    if (msg) {
      ctx.font = "8px " + FONT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = state === "over" ? "#eb0005" : YELLOW;
      ctx.fillText(msg, W / 2, Math.round(11.5 * P));
      if (state === "over") {
        ctx.fillStyle = "#fff";
        ctx.fillText("PRESS SPACE", W / 2, Math.round(13.5 * P));
      }
    }
  }

  // Draws one 1px outline around the wall blocks, inset d from the tile edges.
  function wallLines(d) {
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (!isWall(x, y)) continue;
        [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(function (n) {
          if (isWall(x + n[0], y + n[1])) return;
          var horiz = n[0] === 0;
          var tx = horiz ? 1 : 0, ty = horiz ? 0 : 1;
          var start = (horiz ? x : y) * P, end = start + P - 1;
          var lineAt = (horiz ? y : x) * P + (n[0] + n[1] > 0 ? P - d - 1 : d);
          // Low end
          var sx = x - tx, sy = y - ty;
          var a = !isWall(sx, sy) ? start + d : isWall(sx + n[0], sy + n[1]) ? start - d - 1 : start;
          sx = x + tx; sy = y + ty;
          var b = !isWall(sx, sy) ? end - d : isWall(sx + n[0], sy + n[1]) ? end + d + 1 : end;
          if (horiz) ctx.fillRect(a, lineAt, b - a + 1, 1);
          else ctx.fillRect(lineAt, a, 1, b - a + 1);
        });
      }
    }
  }

  function drawPac(now) {
    var moving = state === "play" && (pac.dx || pac.dy);
    var mouth = moving ? 0.03 + 0.22 * Math.abs(Math.sin(now / 70)) : 0.16;
    var ang = Math.atan2(pac.dy, pac.dx);
    if (!pac.dx && !pac.dy) ang = Math.PI;
    var cx = Math.round((pac.x + 0.5) * P), cy = Math.round((pac.y + 0.5) * P);
    bitmap(pacPixels(mouth, ang), cx - 6, cy - 6, YELLOW);
  }

  function drawGhost(x, y, g, now) {
    var flash = g.scared && frightT < 2 && Math.floor(now / 200) % 2;
    var body = g.scared ? (flash ? "#ffffff" : BLUE) : g.color;
    bitmap(GHOST_TOP, x, y, body);
    bitmap([GHOST_FEET[Math.floor(now / 150) % 2]], x, y + 13, body);
    if (g.scared) {
      bitmap(SCARED, x, y, flash ? "#eb0005" : "#ffb8ae");
      return;
    }
    var ox = g.dx, oy = g.dy;
    [2, 8].forEach(function (ex) {
      bitmap(EYE, x + ex + ox, y + 3 + oy, "#ffffff");
      px(x + ex + ox + 1 + ox, y + 3 + oy + 2 + oy, 2, 2, BLUE);
    });
  }

  function pacIcon() {
    var c = document.createElement("canvas"); c.width = c.height = 13;
    var k = c.getContext("2d"), rows = pacPixels(0.16, 0);
    k.fillStyle = YELLOW;
    rows.forEach(function (r, j) { for (var i = 0; i < 13; i++) if (r[i] === "#") k.fillRect(i, j, 1, 1); });
    return c.toDataURL();
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    update(dt);
    draw(now);
    raf = requestAnimationFrame(frame);
  }

  function resize() {
    var side = window.innerWidth >= 620;
    frameEl.classList.toggle("stacked", !side);
    var chrome = 32 + 42;
    var availW = window.innerWidth - chrome - (side ? 170 + 28 : 0);
    var availH = window.innerHeight - chrome - (side ? 0 : 190);
    var scale = Math.min(availW / (COLS * P), availH / (ROWS * P));
    scale = scale >= 2 ? Math.floor(scale) : Math.max(1, Math.floor(scale * 2) / 2);
    canvas.width = COLS * P;
    canvas.height = ROWS * P;
    canvas.style.width = COLS * P * scale + "px";
    canvas.style.height = ROWS * P * scale + "px";
    ctx.imageSmoothingEnabled = false;
  }

  function steer(name) {
    if (state === "over") { newGame(); return; }
    var d = DIRS[name];
    want = d;
    if (state === "play" && (pac.dx || pac.dy) && d[0] === -pac.dx && d[1] === -pac.dy) {
      pac.tx -= pac.dx; pac.ty -= pac.dy;
      pac.dx = d[0]; pac.dy = d[1];
    }
  }

  function show() {
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    resize();
    newGame();
    last = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  }

  var KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right"
  };
  document.addEventListener("keydown", function (ev) {
    if (overlay.hidden) return;
    if (KEYS[ev.key]) { ev.preventDefault(); steer(KEYS[ev.key]); return; }
    if ((ev.key === " " || ev.key === "Enter") && state === "over") { ev.preventDefault(); newGame(); }
  });

  var touch = null;
  canvas.addEventListener("touchstart", function (ev) {
    var t = ev.changedTouches[0];
    touch = [t.clientX, t.clientY];
  }, { passive: true });
  canvas.addEventListener("touchend", function (ev) {
    if (!touch) return;
    var t = ev.changedTouches[0], dx = t.clientX - touch[0], dy = t.clientY - touch[1];
    touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { if (state === "over") newGame(); return; }
    steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  canvas.addEventListener("click", function () { if (state === "over") newGame(); });

  document.querySelectorAll("[data-dir]").forEach(function (b) {
    b.addEventListener("click", function () { steer(b.getAttribute("data-dir")); });
  });

  PAC_ICON = pacIcon();
  show();
  window.addEventListener("resize", function () { if (!overlay.hidden) resize(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) cancelAnimationFrame(raf);
    else if (!overlay.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
  });
})();
</script>
</body></html>
